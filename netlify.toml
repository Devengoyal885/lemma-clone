# Netlify deployment configuration for Lemma Frontend

[build]
  # Build command - just copy frontend files
  command = "echo 'Frontend ready for deployment'"
  publish = "frontend"

# Handle SPA routing - all requests go to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Environment variables for Netlify deploy
[env]
  [env.production]
    BACKEND_API_URL = "http://localhost:8000"
  [env.staging]
    BACKEND_API_URL = "http://localhost:8000"
  [env.development]
    BACKEND_API_URL = "http://localhost:8000"

# Headers for security and CORS
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# API proxy rules (optional - if backend is on same domain)
[[redirects]]
  from = "/api/*"
  to = "http://localhost:8000/api/:splat"
  status = 200
  force = false
